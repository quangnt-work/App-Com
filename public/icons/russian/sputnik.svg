<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <linearGradient id="antennaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background glow circle -->
  <circle cx="200" cy="200" r="140" fill="#f1f5f9" opacity="0.5"/>
  
  <!-- 4 Antennas extending backwards -->
  <!-- Top Right Antenna -->
  <path d="M 220 180 L 360 70" stroke="url(#antennaGrad1)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="360" cy="70" r="5" fill="#e2e8f0"/>
  
  <!-- Bottom Right Antenna -->
  <path d="M 225 210 L 370 270" stroke="url(#antennaGrad1)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="370" cy="270" r="5" fill="#e2e8f0"/>
  
  <!-- Middle Far Right Antenna -->
  <path d="M 230 195 L 385 160" stroke="url(#antennaGrad1)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="385" cy="160" r="4.5" fill="#e2e8f0"/>
  
  <!-- Lower Back Antenna -->
  <path d="M 215 225 L 330 350" stroke="url(#antennaGrad1)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="330" cy="350" r="5" fill="#e2e8f0"/>

  <!-- Satellite Main Sphere -->
  <circle cx="170" cy="210" r="75" fill="url(#sphereGrad)" filter="url(#glow)"/>
  
  <!-- Highlight shine -->
  <ellipse cx="145" cy="180" rx="28" ry="16" fill="#ffffff" opacity="0.6" transform="rotate(-30 145 180)"/>
  
  <!-- Seam line across satellite sphere -->
  <path d="M 105 240 Q 170 210 235 180" stroke="#64748b" stroke-width="3" fill="none" opacity="0.7"/>
  
  <!-- Little red beacon light / radio transmitter dot -->
  <circle cx="160" cy="215" r="7" fill="#ef4444"/>
  <circle cx="160" cy="215" r="3" fill="#fecaca"/>
</svg>
